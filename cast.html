<script type="module">

const CAST = new URLSearchParams(location.search).get('c') === 'saku' ? 'saku' : 'nagi';
const BASE = 'morph/' + CAST + '/';
const RIG = await (await fetch(BASE + 'rig.json')).json();
const MAN = await (await fetch(BASE + 'manifest.json')).json();
const IMG = Object.fromEntries(Object.entries(MAN).map(([k, f]) => [k, BASE + f]));
const RIGBIN = null, VOICE = null;
const W = RIG.canvas[0], H = RIG.canvas[1];
const PR = Object.assign({face_center: [475, 520], hair_tip: [1000, 1420], light: [28, 870],
  hair_body: [820, 980], tilt_fade: [850, 700], turn_fade: [900, 780]}, RIG.params || {});   // *_fade・hair_body は [下の y, 上の y]
const NAME = {nagi: '凪', saku: '朔'}[RIG.cast] || '';
// キャラごとの動きの性格。凪＝静かで抑えた動き、朔＝思案気味でぼんやり・少し間がずれる
const CHAR = {
  nagi: {glanceP: 0.28, glanceHold: [0.8, 1.0], centerHold: [3.6, 4.4], glanceY: [-0.2, 0.4], headFollow: 0.55, tilt: 0.6,
         headW: 6.5, headZ: 0.88, slowBlink: 0.06, halfBlink: 0.1, dblBlink: 0.1, blinkGap: [2.8, 3.6], nod: 0.55, hair: 0.6, hairOnBody: 0.15, lidRest: 0, saccadeBlink: 0.4,
         think: [0, 0.55], thinkTilt: 0, thinkStill: 0.25, nodAns: 4.5, nodDelay: 0, nodsLong: 1, typingGlance: false, shyAway: 0.35},
  saku: {glanceP: 0.6, glanceHold: [1.4, 2.4], centerHold: [1.8, 3.0], glanceY: [-0.7, 0.15], headFollow: 0.9, tilt: 0.9,
         headW: 5.0, headZ: 0.62, slowBlink: 0.3, halfBlink: 0.12, dblBlink: 0.06, blinkGap: [2.6, 4.2], nod: 0.9, hair: 0.4, hairOnBody: 0.12, lidRest: 0.1, saccadeBlink: 0.65,
         think: [0.5, -0.65], thinkTilt: 1.0, thinkStill: 0.8, nodAns: 5.5, nodDelay: 250, nodsLong: 2, typingGlance: true, shyAway: 0.7},
}[RIG.cast] || {};
const C = Object.assign({glanceP: 0.45, glanceHold: [1.0, 1.6], centerHold: [2.4, 3.6], glanceY: [-0.25, 0.35], headFollow: 0.8, tilt: 1,
  headW: 7.5, headZ: 0.72, slowBlink: 0.1, halfBlink: 0.12, dblBlink: 0.16, blinkGap: [2.4, 3.4], nod: 1, hair: 1, hairOnBody: 1, lidRest: 0, saccadeBlink: 0.55,
  think: [0, 0.4], thinkTilt: 0, thinkStill: 0.5, nodAns: 5, nodDelay: 0, nodsLong: 1, typingGlance: false, shyAway: 0.5}, CHAR);
// 体の動きは「動いていると気づかない」程度に抑える（2026-11-10 ユーザー指定）
const BODY = {breath: 1.1, chest: 0.0018, sway: 0.45, hairAmb: 0.35, deep: 1.45, light: 0.5};
const qs = new URLSearchParams(location.search);
if (qs.has('capture')) document.body.classList.add('capture');

// ---- 時計（録画用に仮想時刻へ切り替えられる）と乱数 -----------------------
let vt = null;
const t0 = performance.now();
const now = () => vt !== null ? vt : (performance.now() - t0) / 1000;
let seed = 12345;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

// ---- 状態 ------------------------------------------------------------------
const S = {
  mode: qs.get('mode') === 'old' ? 'old' : 'new',
  render: qs.get('render') === 'vertex' ? 'vertex' : 'pixel',   // pixel＝画素ごとの計算（最初の試作）／vertex＝頂点だけ（アプリと同じ描き方）
  k: 1,
  eyes: 0,                 // 0=開 1=半 2=閉
  mouth: 0,                // 0=閉 1=半開き
  face: {edge: 0, t: 0},   // regions.face.edges の番号と進み具合
  exprBusy: false, blinking: false,
  tiltAccent: 0, nodAccent: 0,
  ptr: null,               // なぞっている位置（キャンバス座標）。離したら null
  voiceStart: -1,          // 声を出し始めた時刻。出していなければ -1
  scene: 'idle',           // 会話の場面：idle（待っている）/ typing（客が打っている）/ thinking（返事を考えている）/ answered（返事が出た）
  motion: 1,               // ふだんの揺れの量（考えている間・重い話のときに下げる）
  calm: 0,                 // 静かな動きを続ける残りターン数（重い話を受け止めた後）
  lastEmo: '', abortExpr: false, forceAtt: null, glanceAt: 0, done: false,
  cap: {scene: '', user: '', reply: ''},   // 画面に出す説明

const isNew = () => S.mode === 'new';
const talking = t => !!VOICE && S.voiceStart >= 0 && t - S.voiceStart < VOICE.dur;

// tween：値を時間をかけて動かす。await で順番に並べられる
const tweens = [];
function tween(obj, key, to, ms, ease) {
  return new Promise(res => tweens.push({obj, key, from: obj[key], to, start: now(), dur: ms / 1000, ease: ease || (x => x), res}));

const sleep = ms => { const o = {v: 0}; return tween(o, 'v', 1, ms); };
function runTweens(t) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i]; const p = w.dur <= 0 ? 1 : Math.min(1, (t - w.start) / w.dur);

// ばね：目標へ、少し行き過ぎてから落ち着く動きを作る
class Spring {
  constructor(w, z) { this.x = 0; this.v = 0; this.w = w; this.z = z; }
  step(target, dt) {
    const n = Math.max(1, Math.ceil(dt / 0.008)), h = dt / n;
    for (let i = 0; i < n; i++) { this.v += (this.w * this.w * (target - this.x) - 2 * this.z * this.w * this.v) * h; this.x += this.v * h; }
    return this.x;

const head = {x: new Spring(C.headW, C.headZ), y: new Spring(C.headW + 1, C.headZ), z: new Spring(C.headW - 1, C.headZ + 0.03)};   // 向き左右・上下・首の傾き
const eye = {x: new Spring(42, 0.9), y: new Spring(42, 0.9)};                                 // 視線は速い
const hair = {l: new Spring(5.2, 0.32), lt: new Spring(4.0, 0.28), r: new Spring(6.0, 0.34), rt: new Spring(4.6, 0.3), b: new Spring(11, 0.45)};
const att = {x: 0, y: 0, next: 2.5};   // いま気を向けている先（-1..1）

// ---- 瞬き ------------------------------------------------------------------
async function blink(kind) {
  if (S.blinking || S.exprBusy || S.face.t > 0 || S.face.edge !== 0) return;   // 表情中は閉じ目の素材が無い
  S.blinking = true;
  if (!isNew()) { S.eyes = 1; await sleep(100); S.eyes = 2; await sleep(100); S.eyes = 1; await sleep(100); S.eyes = 0; }
  else if (kind === 'slow') { await tween(S, 'eyes', 2, 170, easeIO); await sleep(120); await tween(S, 'eyes', 0, 320, easeOut); }
  else if (kind === 'half') { await tween(S, 'eyes', 1.15, 70, easeIn); await tween(S, 'eyes', 0, 150, easeOut); }
  else { await tween(S, 'eyes', 2, 85, easeIn); await sleep(45); await tween(S, 'eyes', 0, 190, easeOut); }
  S.blinking = false;
}
async function blinkLoop() {
  for (;;) {
    await sleep((talking(now()) ? 0.75 : 1) * (C.blinkGap[0] + rnd() * C.blinkGap[1]) * 1000);
    const r = rnd();
    if (!isNew()) await blink();
    else if (r < C.dblBlink) { await blink(); await sleep(110); await blink(); }
    else if (r < C.dblBlink + C.slowBlink) await blink('slow');
    else await blink(r > 1 - C.halfBlink ? 'half' : undefined);
  }
}

// ---- 表情 ------------------------------------------------------------------
const faceEdge = b => RIG.regions.face.edges.findIndex(e => e.b === b);

// 感情ごとの身ぶり [首の傾き(度), うつむき]。troubled＝困っている、quiet＝重い話を受け止めている（顔の絵はどちらも pensive）

const FACE = {smile: 'smile', shy: 'shy', troubled: 'pensive', quiet: 'pensive', smirk: 'smirk'};
const EMO_JA = {smile: '微笑み', shy: '照れ', troubled: 'しんみり（困っている）', quiet: 'しんみり（受け止めている）', smirk: 'ニヤリ'};

  S.exprBusy = true; S.abortExpr = false;

  const hold = clamp(1.5 + (opt.chars || 40) * 0.06, 2.5, 6) * 1000;
  const amp = (kind === S.lastEmo ? 0.6 : 1) * (S.calm > 0 && (kind === 'smile' || kind === 'smirk') ? 0.5 : 1);
  S.lastEmo = kind; S.cap.scene = '感情：' + EMO_JA[kind]; showCap();
  if (kind === 'quiet') { S.calm = 3; tween(S, 'motion', 0.3, 500); }      // この返事＋あと 2 ターン静かにする
  if (isNew() && kind === 'smirk') { S.forceAtt = {x: 0.55, y: -0.1, until: now() + 0.22}; await sleep(220); }   // 入る直前に一瞬だけ視線を外す
  while (S.blinking) await sleep(30);
  S.eyes = 0;
  const f = S.face;
  const go = (to, ms) => isNew() ? tween(f, 't', to, ms, easeIO) : (f.t = to, Promise.resolve());
  const wait = async ms => { const end = now() + ms / 1000; while (now() < end && !S.abortExpr) await sleep(50); };   // 客が打ち始めたら切り上げる
  if (isNew()) { tween(S, 'tiltAccent', POSE[kind][0] * amp, 520, easeOut); tween(S, 'nodAccent', POSE[kind][1] * amp, 560, easeOut); }
  if (kind === 'smile') {
    f.edge = EDGE.smile; await go(1, 260);
    f.edge = EDGE.peak; f.t = 0; await go(1, 220); await wait(900); await go(0, 320);
    f.edge = EDGE.smile; f.t = 1; await wait(hold - 1700); await go(0, S.abortExpr ? 250 : 380);
  } else {
    f.edge = EDGE[FACE[kind]]; await go(1, 300); await wait(hold); await go(0, S.abortExpr ? 250 : 400);
  }

  if (isNew()) { tween(S, 'tiltAccent', 0, 800, easeIO); tween(S, 'nodAccent', 0, 800, easeIO); }
  const cut = S.abortExpr;
  S.exprBusy = false;
  if (S.cap.scene.startsWith('感情')) { S.cap.scene = ''; showCap(); }
  if (!isNew() || cut) return;
  await sleep(160);
  if (kind === 'shy') { S.forceAtt = {x: 0.6, y: 0.25, until: now() + C.shyAway}; await sleep(C.shyAway * 1000 + 120); blink(); }   // 戻るとき一度だけ視線を外す
  else if (kind === 'troubled') { await blink(); await sleep(110); blink(); }
  else if (kind === 'quiet') blink('slow');
  else blink();
}

// ---- 会話の場面 ------------------------------------------------------------
const SCENE_JA = {idle: '', typing: '場面：客が打っている', thinking: '場面：返事を考えている', answered: '場面：返事が出た'};
function showCap() {}
function setScene(sc, opt = {}) {
  S.scene = sc;
  if (!(sc === 'idle' && S.exprBusy)) S.cap.scene = SCENE_JA[sc];   // 表情が出ている間は「感情：〜」の字幕を消さない
  showCap();
  if (!isNew()) return;
  if (sc === 'typing') { if (S.exprBusy) S.abortExpr = true; else tween(S, 'tiltAccent', 0, 400, easeIO); tween(S, 'motion', S.calm > 0 ? 0.6 : 1, 400); S.glanceAt = now() + 1.5; }
  if (sc === 'thinking') { tween(S, 'motion', C.thinkStill, 600); tween(S, 'tiltAccent', C.thinkTilt, 700, easeIO); if (C.thinkStill < 0.5) blink('slow'); }
  if (sc === 'answered') {
    S.calm = Math.max(0, S.calm - 1);
    tween(S, 'motion', S.calm > 0 ? 0.6 : 1, 500); tween(S, 'tiltAccent', 0, 450, easeIO);
    const nods = (opt.chars || 30) >= 40 ? C.nodsLong : 1;     // 視線を客へ戻して、うなずく
    (async () => { await sleep(C.nodDelay + 120); for (let i = 0; i < nods; i++) { head.y.v += C.nodAns * S.k; await sleep(430); } })();
    (async () => { await sleep(1400); if (S.scene === 'answered') setScene('idle'); })();
  }
  if (sc === 'idle') { tween(S, 'motion', S.calm > 0 ? 0.6 : 1, 500); if (!S.exprBusy) tween(S, 'tiltAccent', 0, 500, easeIO); }
}
const CONV = {};
let convBusy = false;
async function converse(key) {
  const c = CONV[key]; if (!c || convBusy) return; convBusy = true;
  const emo = key === 'neutral' || key === 'after' ? null : key;
  S.cap.user = '（入力中）' + c[0]; S.cap.reply = ''; setScene('typing'); await sleep(1900);
  S.cap.user = c[0]; setScene('thinking'); await sleep(1600);
  S.cap.reply = c[1]; setScene('answered', {chars: c[1].length}); await sleep(900);      // 感情は返事の約 1 秒後に届く
  if (emo) await express(emo, {chars: c[1].length}); else await sleep(2200);
  await sleep(700);
  if (S.scene !== 'typing') setScene('idle');
  S.cap.user = ''; S.cap.reply = ''; showCap();
  convBusy = false;
}

// ---- 声と口パク ------------------------------------------------------------
let audioEl = null, oldMouthHold = 0, lastEnv = 0, lastKick = -9;
function speak() {
  if (!VOICE || talking(now())) return;
  S.voiceStart = now();
  if (vt === null) { audioEl = audioEl || new Audio(VOICE.uri); audioEl.currentTime = 0; audioEl.play().catch(() => {}); }
}
function voiceEnv(t) {
  if (!talking(t)) return 0;
  const p = (t - S.voiceStart) * 60, i = Math.floor(p), a = VOICE.env[i] || 0, b = VOICE.env[i + 1] || 0;
  return a + (b - a) * (p - i);
}

// ---- WebGL -----------------------------------------------------------------
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {premultipliedAlpha: true, alpha: true, antialias: false});
function prog(vs, fs) {
  const p = gl.createProgram();
  for (const [ty, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(ty); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);

const VS = `attribute vec2 pos; attribute vec2 uv; varying vec2 v; varying vec2 wp; uniform float flip;
void main(){ v = uv; wp = pos; gl_Position = vec4(pos.x/${W}.0*2.0-1.0, (1.0-pos.y/${H}.0*2.0)*flip, 0.0, 1.0); }`;
// 画像をそのまま描く。glow＝背景のランタン周りの光、warm＝キャラに当たる暖色。どちらも揺らぎの量を渡す
const pTex = prog(VS, `precision highp float; varying vec2 v; varying vec2 wp; uniform sampler2D A; uniform float glow, warm; uniform vec2 light;
void main(){
  vec4 c = texture2D(A, v);
  vec2 d = wp - light;
  c.rgb += vec3(1.0, 0.62, 0.28) * glow * exp(-dot(d, d) / (2.0 * 150.0 * 150.0)) * c.a;
  float f = clamp(1.0 - length(d) / 950.0, 0.0, 1.0);
  c.rgb += c.rgb * vec3(0.9, 0.5, 0.2) * warm * f * f;
  gl_FragColor = c;

// キーポーズ A と B を、それぞれ相手の形へ寄せてから混ぜる。A は「いまの顔」（視線つき）から取れる
const pMorph = prog(VS, `precision highp float; varying vec2 v;
uniform sampler2D A, B, FAB, FBA; uniform float t, maxd; uniform vec2 size, aOff, aScale;
void main(){
  vec2 fa = (texture2D(FAB, v).rg - 128.0/255.0) * 2.0 * maxd / size;
  vec2 fb = (texture2D(FBA, v).rg - 128.0/255.0) * 2.0 * maxd / size;

const pEye = prog(VS, `precision highp float; varying vec2 v;
uniform sampler2D A, MASK; uniform vec2 off;
void main(){
  float w = texture2D(MASK, v).a;
  gl_FragColor = texture2D(A, v - off * w);
}`);
// 頂点方式：頂点ごとに「読む位置」と「濃さ」を持つだけの描き方（Flutter の drawVertices と同じことしかしない）
const pV = prog(`attribute vec2 pos; attribute vec2 uv; attribute float al; varying vec2 v; varying vec2 wp; varying float va;
void main(){ v = uv; wp = pos; va = al; gl_Position = vec4(pos.x/${W}.0*2.0-1.0, 1.0-pos.y/${H}.0*2.0, 0.0, 1.0); }`,
`precision highp float; varying vec2 v; varying vec2 wp; varying float va; uniform sampler2D A; uniform float warm; uniform vec2 light;
void main(){
  vec4 c = texture2D(A, v);
  float f = clamp(1.0 - length(wp - light) / 950.0, 0.0, 1.0);
  c.rgb += c.rgb * vec3(0.9, 0.5, 0.2) * warm * f * f;

const T = {}, EL = {};
const quad = gl.createBuffer(), meshPos = gl.createBuffer(), meshUv = gl.createBuffer(), meshIdx = gl.createBuffer();
const quadData = new Float32Array(16);
function drawQuad(p, x, y, w, h, flip) {

  drawQuad(pTex, 0, 0, W, H, flip);
}
let liveBase, faceOut;          // liveBase＝idle＋視線。faceOut＝その上に瞬き・口・表情を重ねたもの

  runTweens(t);
  direct(t);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0, 0, 0, 0);
  const f = S.face, vertex = S.render === 'vertex' && isNew();
  const lid = isNew() ? Math.max(S.eyes, S.calm > 0 ? 0 : C.lidRest) : S.eyes;      // 朔はふだんから瞼が少しだけ重い（重い話の後は外す）
  if (!vertex) {
    // 1) いまの顔：idle に視線つきの目を重ねる
    gl.bindFramebuffer(gl.FRAMEBUFFER, liveBase.fbo); gl.viewport(0, 0, W, H); gl.clear(gl.COLOR_BUFFER_BIT);
    plain(T.idle, -1);
    if (isNew()) drawGaze(gazeX, gazeY);
    // 2) その上に表情・瞬き・口をモーフで重ねる
    gl.bindFramebuffer(gl.FRAMEBUFFER, faceOut.fbo); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.BLEND); plain(liveBase.tex, -1); gl.enable(gl.BLEND);
    if (f.edge !== 0 || f.t > 0.001) drawEdge('face', f.edge, f.t);
    else {
      if (lid > 0.001) lid <= 1 ? drawEdge('eyes', 0, lid) : drawEdge('eyes', 1, lid - 1);
      if (S.mouth > 0.01) drawEdge('mouth', 0, Math.min(1, S.mouth));
    }
  }
  // 3) 背景 → 体の格子で歪めて画面へ（頂点方式では、画面外の合成をせず idle をそのまま貼る）
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.clear(gl.COLOR_BUFFER_BIT);
  deform(t);
  gl.useProgram(pTex); bind(pTex, 'A', 0, vertex ? T.idle : faceOut.tex);
  gl.uniform1f(U(pTex, 'flip'), 1); gl.uniform1f(U(pTex, 'glow'), 0); gl.uniform1f(U(pTex, 'warm'), flick * 1.5);
  const a = gl.getAttribLocation(pTex, 'pos'), b = gl.getAttribLocation(pTex, 'uv');
  gl.bindBuffer(gl.ARRAY_BUFFER, meshPos); gl.bufferData(gl.ARRAY_BUFFER, cur, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, meshUv);
  gl.enableVertexAttribArray(b); gl.vertexAttribPointer(b, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIdx);
  gl.drawElements(gl.TRIANGLES, meshIdx.count, gl.UNSIGNED_SHORT, 0);
  if (vertex) {
    // 4) 頂点方式：目・口・顔の細かい格子を上から重ねる
    if (f.edge !== 0 || f.t > 0.001) morphLayer('face', f.edge, f.t, 0, 0);
    else {
      if (lid > 1) morphLayer('eyes', 1, lid - 1, 0, 0);
      else if (lid > 0.001 || Math.abs(gazeX) > 0.002 || Math.abs(gazeY) > 0.002) morphLayer('eyes', 0, lid, gazeX, gazeY);
      if (S.mouth > 0.01) morphLayer('mouth', 0, Math.min(1, S.mouth), 0, 0);
    }
  }
}

// ---- 起動 ------------------------------------------------------------------
async function load() {
  await Promise.all(Object.entries(IMG).map(([name, uri]) => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => { T[name] = tex(im, !/_fwd$|_rev$/.test(name)); EL[name] = im; res(); };
    im.onerror = rej; im.src = uri;
  })));
  initMesh();
  // なぞると目と顔が追う。軽く触れたら表情を順に出す
  const setPtr = e => { const r = cv.getBoundingClientRect(); S.ptr = [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  const FACES = ['smile', 'shy'].concat(EDGE.smirk >= 0 ? ['smirk'] : []);
  let down = null, turn = 0;
  cv.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY, performance.now()]; setPtr(e); });
  cv.addEventListener('pointermove', e => { if (S.ptr || e.pointerType === 'mouse') setPtr(e); });
  cv.addEventListener('pointerup', e => {
    if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 12 && performance.now() - down[2] < 500 && !S.exprBusy) express(FACES[turn++ % FACES.length]);
    down = null;
  });
  for (const n of ['pointerup', 'pointercancel', 'pointerleave']) cv.addEventListener(n, e => { if (n !== 'pointerup' || e.pointerType !== 'mouse') S.ptr = null; });
  blinkLoop();
  // 画面に出ている間だけ描く
  let visible = false, raf = 0, greeted = false;
  const loop = () => { raf = 0; if (!visible || document.hidden) return; frame(); raf = requestAnimationFrame(loop); };
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  new IntersectionObserver(es => {
    const e = es[es.length - 1]; visible = e.isIntersecting; if (visible) kick();
    if (!greeted && e.intersectionRatio >= 0.6) { greeted = true; setTimeout(() => express('smile'), 900); }
  }, {threshold: [0, 0.05, 0.6]}).observe(cv);
  document.addEventListener('visibilitychange', kick);
  frame();
  parent.postMessage({liminalCast: CAST, ready: true}, '*');
}
load().catch(() => parent.postMessage({liminalCast: CAST, ready: false}, '*'));

</script>
